dataset_path: flexitok/mod-arithmetic
task: null
output_type: generate_until
training_split: train
test_split: test
doc_to_text: "{{question}}"
doc_to_target: "{{answer}}"
target_delimiter: " "
generation_kwargs:
  until:
    - </s>
    - \n
  do_sample: false
  temperature: 0.0
  max_gen_toks: 8
filter_list:
  - name: "strict-match"
    filter:
      - function: "regex"
        # regex_pattern: "([0-9]+)"
        regex_pattern: (-?[$0-9.,]{2,})|(-?[0-9]+)
        group_select: -1
      - function: "take_first"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: false
    ignore_punctuation: false
metadata:
  version: 1.0
